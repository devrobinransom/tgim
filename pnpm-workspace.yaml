packages:
  - apps/*
  - packages/*
allowBuilds:
  '@clerk/shared': false
  '@prisma/client': true
  '@prisma/engines': true
  agent-browser: true
  browser-tabs-lock: false
  bufferutil: true
  core-js: false
  esbuild: true
  msgpackr-extract: false
  prisma: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true
  workerd: true
minimumReleaseAgeExclude:
  - react-native-screens@4.26.0
