name: verify
on:
  pull_request:
  push:
    branches: [main]
permissions: { contents: read }
concurrency: { group: verify-${{ github.ref }}, cancel-in-progress: true }
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.10.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: sh scripts/verify-sovereign.sh static
  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - run: kubectl kustomize infra/k8s/overlays/production > /tmp/tgim-production.yaml
      - run: test -s /tmp/tgim-production.yaml
