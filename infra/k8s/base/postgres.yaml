apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: tgim-postgres
  namespace: tgim
spec:
  instances: 3
  imageName: registry.tgim.in/mirror/postgis:16-3.5
  primaryUpdateStrategy: unsupervised
  storage: { size: 100Gi, storageClass: encrypted-local-path }
  walStorage: { size: 25Gi, storageClass: encrypted-local-path }
  bootstrap:
    initdb:
      database: tgim
      owner: tgim
      secret: { name: tgim-db-owner }
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS postgis
        - CREATE EXTENSION IF NOT EXISTS pgcrypto
        - CREATE EXTENSION IF NOT EXISTS citext
  backup:
    barmanObjectStore:
      destinationPath: s3://tgim-backups/postgres
      endpointURL: http://minio:9000
      s3Credentials:
        accessKeyId: { name: minio-backup-credentials, key: ACCESS_KEY_ID }
        secretAccessKey: { name: minio-backup-credentials, key: ACCESS_SECRET_KEY }
      wal: { compression: gzip, maxParallel: 4 }
    retentionPolicy: 30d
  monitoring: { enablePodMonitor: true }
  resources: { requests: { cpu: "1", memory: 2Gi }, limits: { cpu: "4", memory: 8Gi } }
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata: { name: tgim-postgres-daily, namespace: tgim }
spec: { schedule: "0 15 2 * * *", backupOwnerReference: self, cluster: { name: tgim-postgres }, immediate: true }
