apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tgim
resources: [../../base]
images:
  - name: registry.tgim.in/tgim/api
    newTag: release-sha-required
  - name: registry.tgim.in/tgim/web
    newTag: release-sha-required
patches:
  - target: { kind: Deployment, name: tgim-api }
    patch: |-
      - op: add
        path: /spec/template/spec/affinity
        value: { podAntiAffinity: { requiredDuringSchedulingIgnoredDuringExecution: [{ labelSelector: { matchLabels: { app: tgim-api } }, topologyKey: kubernetes.io/hostname }] } }
